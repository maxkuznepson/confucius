<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#D32F2F"/>
  
  <!-- Inner circle -->
  <circle cx="100" cy="100" r="85" fill="#FFF3C4"/>
  
  <!-- Pagoda/Temple silhouette -->
  <g transform="translate(100, 100)">
    <!-- Base -->
    <rect x="-30" y="20" width="60" height="8" fill="#D32F2F" rx="2"/>
    
    <!-- First floor -->
    <rect x="-25" y="5" width="50" height="15" fill="#D32F2F"/>
    <polygon points="-30,5 30,5 25,-5 -25,-5" fill="#8B1A1A"/>
    
    <!-- Second floor -->
    <rect x="-20" y="-10" width="40" height="12" fill="#D32F2F"/>
    <polygon points="-25,-10 25,-10 20,-20 -20,-20" fill="#8B1A1A"/>
    
    <!-- Third floor -->
    <rect x="-15" y="-25" width="30" height="10" fill="#D32F2F"/>
    <polygon points="-20,-25 20,-25 15,-35 -15,-35" fill="#8B1A1A"/>
    
    <!-- Top/roof -->
    <polygon points="-10,-35 10,-35 0,-50" fill="#D32F2F"/>
    <circle cx="0" cy="-52" r="3" fill="#FBC02D"/>
  </g>
  
  <!-- Chinese character 孔 (simplified representation) -->
  <text x="100" y="160" font-family="serif" font-size="24" fill="#D32F2F" text-anchor="middle" font-weight="bold">孔</text>
</svg>
